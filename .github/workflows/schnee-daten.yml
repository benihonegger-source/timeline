name: Schneehöhen aktualisieren

on:
  schedule:
    - cron: "17 * * * *"   # stündlich
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schnee-daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: IMIS-Messwerte vom SLF holen
        run: python skigebiete/scripts/fetch_imis.py
      - name: Änderungen committen
        run: |
          if git diff --quiet -- skigebiete/data; then
            echo "Keine neuen Daten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skigebiete/data
          git commit -m "Schneehöhen aktualisiert"
          git pull --rebase
          git push
